name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin (format + tests)
    # Windows: the app uses Win32 (JNA) and Windows-native speech libraries.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Runner CPU
        # int8 model results depend on the CPU (VNNI or not), so the log records which one ran the tests.
        run: powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"
      - name: Cache models
        uses: actions/cache@v6
        with:
          path: brain/models/*-*/
          key: models-${{ hashFiles('brain/models/manifest.json') }}
      - name: Fetch models (checksums verified)
        # Same command as release.yml, so the model tests (EvalSetRouterTest, OnnxParityTest, ...) run.
        run: python brain/src/pebble_brain/download_models.py
      - name: Format check (ktlint via Spotless)
        run: ./gradlew spotlessCheck --console=plain
      - name: Build the app folder
        # BundledModelTest loads the model from it; it also catches missing jlink modules.
        run: ./gradlew :desktopApp:createDistributable --console=plain
      - name: Tests and coverage
        # Tests that still can't find their data skip themselves and print SKIPPED.
        run: ./gradlew :shared:jvmTest :desktopApp:test :desktopApp:koverHtmlReport --console=plain
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: desktopApp/build/reports/kover/html/
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  python:
    name: Python brain (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Ruff format
        run: uvx ruff format --check .
      - name: Ruff lint
        run: uvx ruff check .
      - name: Unit tests
        # Light: only what the tests import (the full training env needs PyTorch + CUDA).
        env:
          PYTHONPATH: src
        run: uv run --no-project --python 3.11 --with indic-transliteration python -m unittest tests/test_feedback.py
