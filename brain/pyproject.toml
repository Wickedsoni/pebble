[project]
name = "pebble-brain"
version = "0.1.0"
description = "Training pipeline for Pebble's local brain: encoder + heads, speech, chat, habit policy."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5",
    "numpy",
    "pandas",
    "scikit-learn",
    "tqdm",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
    "datasets>=3.1",
    "onnx",
    "onnxruntime",
    "matplotlib",
    "ipykernel",
    "jupyterlab",
    "indic-transliteration>=2.3.82",
]

[tool.uv]
package = true

# PyTorch with CUDA for the RTX 4050 comes from PyTorch's own index, not PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pebble_brain"]
