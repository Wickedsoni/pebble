[project]
name = "pebble-brain"
version = "0.1.0"
description = "Training pipeline for Pebble's local brain: encoder + heads, speech, chat, habit policy."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5",
    "numpy",
    "pandas",
    "scikit-learn",
    "tqdm",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
    "datasets>=3.1",
    "onnx",
    "onnxruntime",
    "matplotlib",
    "ipykernel",
    "jupyterlab",
    "indic-transliteration>=2.3.82",
]

[tool.uv]
package = true

# PyTorch with CUDA for the RTX 4050 comes from PyTorch's own index, not PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pebble_brain"]

# Lint + format, enforced in CI:  uvx ruff check .  /  uvx ruff format --check .
[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["notebooks", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",    # long lines are the formatter's job
    "RUF001",  # Devanagari and typographic characters in strings are intended
    "RUF002",
    "RUF003",
    "B905",    # zip() pairs here are equal length by construction
    "E741",    # `l` for a line in comprehensions
    "RUF005",  # list concatenation is clear enough
    "RUF007",
]
